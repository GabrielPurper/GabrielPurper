name: Atualizar Estatísticas do README

on:
  schedule:
    - cron: "0 */6 * * *" # Recomendado: a cada 6 horas (evita sobrecarga na API do GitHub)
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão explícita necessária para realizar o push no repositório

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Atualizar README (forçar atualização do cache)
        run: |
          sed -i "s/cacheBuster=.*/cacheBuster=$(date +%s)/" README.md || true

      - name: Commit e Push das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: atualização automática das estatísticas do README [skip ci]"
            git push
          fi
